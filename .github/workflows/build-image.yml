name: Build image

# Builds one image natively on each architecture's runner, then combines the builds
# into the published multi-architecture tags. Called by images.yml.
on:
  workflow_call:
    inputs:
      image:
        type: string
        required: true
      archs:
        description: JSON list of architectures, e.g. ["amd64", "arm64"]
        type: string
        required: true
      tags:
        description: Space-separated tags to publish
        type: string
        required: true
      version:
        description: The image's version from its image.json, e.g. 1.0.0
        type: string
        required: true

env:
  REGISTRY: ghcr.io/kankava/devcontainer-images

jobs:
  build:
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.archs) }}
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: npm install -g @devcontainers/cli
      # Pushed under a tag per architecture, which the merge job combines
      - run: scripts/build.sh --push "${{ inputs.image }}"
        env:
          TAGS: build-${{ matrix.arch }}

  # Publishes only once every architecture has built
  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # the git tag for the published version
      packages: write
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Combine the architectures into the published tags
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ inputs.image }}
          ARCHS: ${{ inputs.archs }}
          TAGS: ${{ inputs.tags }}
        run: |
          mapfile -t sources < <(jq -r --arg image "${IMAGE}" '.[] | "\($image):build-\(.)"' <<< "${ARCHS}")
          read -ra tags <<< "${TAGS}"
          args=()
          for tag in "${tags[@]}"; do
              args+=(--tag "${IMAGE}:${tag}")
          done
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${IMAGE}:latest"
      # Marks the commit that first published this version, which the version check compares with
      - name: Tag the published version in git
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: image_${{ inputs.image }}_${{ inputs.version }}
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" > /dev/null 2>&1; then
              gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${TAG}" -f sha="${GITHUB_SHA}" > /dev/null
          fi
