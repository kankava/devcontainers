name: Build image

# Builds and tests one image natively on each architecture's runner, then combines the builds
# into the published multi-architecture tags and creates a release. Called by images.yml.
on:
  workflow_call:
    inputs:
      image:
        type: string
        required: true
      archs:
        description: JSON list of architectures, e.g. ["amd64", "arm64"]
        type: string
        required: true
      tags:
        description: Space-separated tags to publish
        type: string
        required: true
      version:
        description: The image's version from its image.json, e.g. 1.0.0
        type: string
        required: true

env:
  REGISTRY: ghcr.io/kankava/devcontainer-images

jobs:
  build:
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.archs) }}
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: npm install -g @devcontainers/cli
      - name: Build
        run: scripts/build.sh "${{ inputs.image }}"
        env:
          TAGS: build-${{ matrix.arch }}
      - name: Test
        run: scripts/test.sh "${{ inputs.image }}"
        env:
          TAG: build-${{ matrix.arch }}
      # Under a tag per architecture, which the merge job combines
      - name: Push
        run: docker push "${REGISTRY}/${{ inputs.image }}:build-${{ matrix.arch }}"

  # Publishes only once every architecture has built and passed its tests
  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release and its git tag
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # for the release notes: the commits since the last published version
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Combine the architectures into the published tags
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ inputs.image }}
          ARCHS: ${{ inputs.archs }}
          TAGS: ${{ inputs.tags }}
        run: |
          mapfile -t sources < <(jq -r --arg image "${IMAGE}" '.[] | "\($image):build-\(.)"' <<< "${ARCHS}")
          read -ra tags <<< "${TAGS}"
          args=()
          for tag in "${tags[@]}"; do
              args+=(--tag "${IMAGE}:${tag}")
          done
          docker buildx imagetools create "${args[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${IMAGE}:latest"
      # The release's git tag, image_<name>_<version>, marks the commit that published this
      # version, which images.yml compares with to check for changes without a version bump
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NAME: ${{ inputs.image }}
          VERSION: ${{ inputs.version }}
          IMAGE: ${{ env.REGISTRY }}/${{ inputs.image }}
        run: |
          tag="image_${NAME}_${VERSION}"
          if gh release view "${tag}" > /dev/null 2>&1; then
              echo "${tag} is already released"
              exit 0
          fi
          last="$(git tag -l "image_${NAME}_*" | sed "s/^image_${NAME}_//" | grep -vxF "${VERSION}" | sort -V | tail -1 || true)"
          mapfile -t inputs < <(scripts/inputs.sh "${NAME}")
          {
              echo "\`docker pull ${IMAGE}:${VERSION}\`"
              echo
              if [[ "${NAME}" != base ]]; then
                  echo "Built on base $(jq -r .version images/base/image.json)."
                  echo
              fi
              if [[ -z "${last}" ]]; then
                  echo "First release."
              else
                  echo "Changes since ${last}:"
                  echo
                  git log --format='- %s (%h)' "image_${NAME}_${last}..${GITHUB_SHA}" -- "${inputs[@]}"
              fi
          } > "${RUNNER_TEMP}/notes.md"
          gh release create "${tag}" --target "${GITHUB_SHA}" --title "${NAME} ${VERSION}" --notes-file "${RUNNER_TEMP}/notes.md"
